<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ナンプレ｜すぐ・あそび</title>
    <meta
      name="description"
      content="ナンプレ。6×6と9×9。はじめの数字とヒントの数をせってい。理由だけのヒント。広告なし。"
    />
    <meta name="theme-color" content="#4eb6e0" />
    <link rel="icon" type="image/png" href="../../images/favicon-32.png" />
    <link rel="apple-touch-icon" href="../../images/icon-180.png" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="css/nanpure.css" />
  </head>
  <body class="nanpure-page">
    <section id="screen-setup" class="screen wrap">
      <a class="back" href="../../index.html">← 玄関にもどる</a>
      <p class="site-name">ナンプレ・数独</p>
      <h1>ナンプレ</h1>
      <p class="lead">マスを選んで、下の数字を入れます。ヒントは理由だけです。</p>

      <div class="field">
        <label>ばんめん</label>
        <div class="size-row">
          <button type="button" class="btn btn-ghost size-btn" data-size="6">6×6</button>
          <button type="button" class="btn btn-ghost size-btn" data-size="9">9×9</button>
        </div>
      </div>
      <div class="field">
        <label>はじめの数字</label>
        <div class="stepper">
          <button type="button" class="btn btn-ghost" data-set="givens" data-dir="-1">−</button>
          <output id="out-givens">38こ（やさしい）</output>
          <button type="button" class="btn btn-ghost" data-set="givens" data-dir="1">＋</button>
        </div>
        <p class="field-note">多いほどやさしいです。</p>
      </div>
      <div class="field">
        <label>ヒントの数</label>
        <div class="stepper">
          <button type="button" class="btn btn-ghost" data-set="hints" data-dir="-1">−</button>
          <output id="out-hints">3かい</output>
          <button type="button" class="btn btn-ghost" data-set="hints" data-dir="1">＋</button>
        </div>
      </div>

      <button type="button" class="btn btn-wide" id="setup-start">はじめる</button>
    </section>

    <section id="screen-play" class="screen wrap" hidden>
      <div class="play-nav">
        <button type="button" class="btn btn-ghost" id="play-quit">やめる</button>
        <a class="back" href="../../index.html">玄関</a>
      </div>
      <div class="play-head">
        <h1>ナンプレ</h1>
        <p class="play-meta" id="play-meta">9×9　やさしい</p>
      </div>
      <p class="how">マスを選んで、下の数字を押してください。はじめの数字は動かせません。</p>
      <p class="hint-box" id="hint-text" aria-live="polite">
        マスを選んで、下の数字を押してください。
      </p>
      <div id="done-box" class="done-box" hidden>できた！</div>
      <div id="board" class="board" role="grid" aria-label="ナンプレの盤面"></div>
      <div id="pad" class="pad">
        <button type="button" class="pad-n" data-n="1">1</button>
        <button type="button" class="pad-n" data-n="2">2</button>
        <button type="button" class="pad-n" data-n="3">3</button>
        <button type="button" class="pad-n" data-n="4">4</button>
        <button type="button" class="pad-n" data-n="5">5</button>
        <button type="button" class="pad-n" data-n="6">6</button>
        <button type="button" class="pad-n extra" data-n="7">7</button>
        <button type="button" class="pad-n extra" data-n="8">8</button>
        <button type="button" class="pad-n extra" data-n="9">9</button>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost btn-wide" id="erase">けす</button>
        <button type="button" class="btn btn-wide" id="hint-btn">ヒント のこり3</button>
        <button type="button" class="btn btn-ghost btn-wide" id="again">やりなおす</button>
        <button type="button" class="btn btn-ghost btn-wide" id="next">つぎの問題</button>
      </div>
    </section>

    <script src="js/engine.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/generate.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
