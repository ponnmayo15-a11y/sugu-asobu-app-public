<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>懸賞パズル｜すぐ・あそび</title>
    <meta
      name="description"
      content="イラストロジック（お絵かきロジック）。練習用。賞品はありません。ブラウザですぐ。"
    />
    <meta name="theme-color" content="#4eb6e0" />
    <link rel="icon" type="image/png" href="../../images/favicon-32.png" />
    <link rel="apple-touch-icon" href="../../images/icon-180.png" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="css/puzzle.css" />
  </head>
  <body class="prize-page">
    <section id="screen-setup" class="screen wrap">
      <a class="back" href="../../index.html">← ホームに戻る</a>
      <p class="site-name">懸賞パズル</p>
      <h1>せってい</h1>
      <p class="notice">練習用。賞品はありません。</p>
      <p class="lead">難易度を決めてから、はじめてください。</p>
      <div class="field">
        <label>難易度</label>
        <div class="stepper">
          <button type="button" class="btn btn-ghost" id="level-minus">−</button>
          <output id="out-level">やさしい（5×5）</output>
          <button type="button" class="btn btn-ghost" id="level-plus">＋</button>
        </div>
        <p class="field-note">やさしい・ふつうは5×5。むずかしいは8×8です。</p>
      </div>
      <button type="button" class="btn btn-wide" id="setup-start">はじめる</button>
    </section>

    <section id="screen-logic" class="screen wrap" hidden>
      <button type="button" class="btn btn-ghost" id="logic-setup">← せっていにもどる</button>
      <p class="site-name">懸賞パズル</p>
      <p class="notice">練習用。賞品はありません。</p>
      <div class="play-head">
        <h1>イラストロジック</h1>
        <p class="play-meta" id="logic-meta"></p>
      </div>
      <p class="how">マスを押す：塗る → × → 空。はめ直せます。</p>
      <div id="logic-done" class="done-box" hidden>
        <p>できた！</p>
        <button type="button" class="btn btn-wide" id="logic-next">つぎの問題</button>
      </div>
      <p class="check-msg" id="logic-check-msg"></p>
      <div class="board-scroll">
        <div id="logic-board" class="logic-grid"></div>
      </div>
      <div class="play-actions">
        <button type="button" class="btn btn-wide" id="logic-check">確認する</button>
        <button type="button" class="btn btn-ghost btn-wide" id="logic-reset">やりなおす</button>
      </div>
    </section>

    <script src="js/logic-engine.js"></script>
    <script src="js/logic-puzzles.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>
    <script src="../../js/access-url.js"></script>
    <script src="../../js/access.js"></script>
  </body>
</html>
