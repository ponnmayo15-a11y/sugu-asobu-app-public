<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>逆唱｜すぐ・あそび</title>
    <meta
      name="description"
      content="数字を見て、逆の順で答える。足し算はしない。広告なし。"
    />
    <meta name="theme-color" content="#4eb6e0" />
    <link rel="icon" type="image/png" href="../../images/favicon-32.png" />
    <link rel="apple-touch-icon" href="../../images/icon-180.png" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="css/gyakusho.css?v=14" />
  </head>
  <body class="gyakusho-page">
    <section id="screen-setup" class="screen wrap">
      <a class="back" href="../../index.html">← 玄関に戻る</a>
      <h1>逆唱</h1>
      <p class="lead">数字を見て、消えたら逆の順で入れます。例: 3 8 1 と出たら、1 8 3</p>

      <h2 class="setup-title">設定</h2>
      <div class="field">
        <label>桁数</label>
        <div class="pick-row cols-3">
          <button type="button" class="btn btn-ghost pick" data-digits="3">3桁</button>
          <button type="button" class="btn btn-ghost pick" data-digits="4">4桁</button>
          <button type="button" class="btn btn-ghost pick" data-digits="5">5桁</button>
          <button type="button" class="btn btn-ghost pick" data-digits="6">6桁</button>
          <button type="button" class="btn btn-ghost pick" data-digits="7">7桁</button>
        </div>
      </div>
      <div class="field">
        <label>見る時間</label>
        <div class="stepper">
          <button type="button" class="btn btn-ghost" id="view-down">−</button>
          <output id="out-view">5秒</output>
          <button type="button" class="btn btn-ghost" id="view-up">＋</button>
        </div>
        <p class="field-note">2秒から10秒まで。1秒ずつ変えられます。</p>
      </div>
      <div class="field">
        <label>回数</label>
        <div class="stepper">
          <button type="button" class="btn btn-ghost" id="goal-down">−</button>
          <output id="out-goal">5回</output>
          <button type="button" class="btn btn-ghost" id="goal-up">＋</button>
        </div>
        <p class="field-note">3回から10回まで。10の次は無限です。</p>
      </div>
      <div class="field">
        <label>数字の動き</label>
        <div class="pick-row">
          <button type="button" class="btn btn-ghost pick" data-move="0">動かさない</button>
          <button type="button" class="btn btn-ghost pick" data-move="1">少し動かす</button>
        </div>
      </div>

      <button type="button" class="btn btn-wide" id="setup-start">始める</button>
    </section>

    <section id="screen-play" class="screen wrap" hidden>
      <header class="play-top">
        <div class="play-nav">
          <button type="button" class="btn btn-ghost" id="play-quit">やめる</button>
          <a class="back" href="../../index.html">玄関</a>
        </div>
        <div class="hud">
          <p>正解 <strong id="score">0</strong></p>
          <p><strong id="progress">1 / 5</strong></p>
        </div>
        <p class="hint" id="hint">覚えましょう</p>
      </header>

      <div class="stage">
        <div class="digit-line" id="digit-line"></div>
        <p class="judge" id="judge" aria-live="polite"></p>
      </div>

      <div class="pad" id="pad">
        <button type="button" class="pad-n" data-n="1">1</button>
        <button type="button" class="pad-n" data-n="2">2</button>
        <button type="button" class="pad-n" data-n="3">3</button>
        <button type="button" class="pad-n" data-n="4">4</button>
        <button type="button" class="pad-n" data-n="5">5</button>
        <button type="button" class="pad-n" data-n="6">6</button>
        <button type="button" class="pad-n" data-n="7">7</button>
        <button type="button" class="pad-n" data-n="8">8</button>
        <button type="button" class="pad-n" data-n="9">9</button>
        <button type="button" id="erase">消す</button>
      </div>
    </section>

    <section id="screen-result" class="screen wrap" hidden>
      <a class="back" href="../../index.html">← 玄関に戻る</a>
      <p class="site-name">数字を逆から</p>
      <h1>終了</h1>
      <p class="result-score" id="result-score">0</p>
      <p class="result-unit" id="result-unit">0問中 正解</p>
      <p class="result-meta" id="result-meta"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-wide" id="again">もう一度</button>
        <button type="button" class="btn btn-ghost btn-wide" id="to-setup">設定を変える</button>
        <a class="btn btn-ghost btn-wide" href="../../index.html">玄関に戻る</a>
      </div>
    </section>

    <script src="js/problem.js?v=14"></script>
    <script src="js/storage.js?v=14"></script>
    <script src="js/main.js?v=14"></script>
  </body>
</html>
