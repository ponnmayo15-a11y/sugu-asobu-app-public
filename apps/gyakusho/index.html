<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>逆唱｜すぐ・あそび</title>
    <meta
      name="description"
      content="数字を見て、逆の順で答える。足し算はしない。広告なし。"
    />
    <meta name="theme-color" content="#4eb6e0" />
    <link rel="icon" type="image/png" href="../../images/favicon-32.png" />
    <link rel="apple-touch-icon" href="../../images/icon-180.png" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="css/gyakusho.css?v=2" />
  </head>
  <body class="gyakusho-page">
    <section id="screen-setup" class="screen wrap">
      <a class="back" href="../../index.html">← 玄関にもどる</a>
      <p class="site-name">数字を逆から</p>
      <h1>逆唱</h1>
      <p class="lead">最初にせっていします。数字を見て、消えたら逆の順で入れます。足し算はしません。</p>
      <p class="field-note">例: 3 8 1 と出たら、1 8 3</p>

      <h2 class="setup-title">せってい</h2>
      <div class="field">
        <label>ケタ数</label>
        <div class="pick-row">
          <button type="button" class="btn btn-ghost pick" data-digits="3">3ケタ</button>
          <button type="button" class="btn btn-ghost pick" data-digits="4">4ケタ</button>
          <button type="button" class="btn btn-ghost pick" data-digits="5">5ケタ</button>
          <button type="button" class="btn btn-ghost pick" data-digits="6">6ケタ</button>
          <button type="button" class="btn btn-ghost pick" data-digits="7">7ケタ</button>
          <button type="button" class="btn btn-ghost pick" data-digits="8">8ケタ</button>
        </div>
      </div>
      <div class="field">
        <label>見る時間</label>
        <div class="pick-row cols-3">
          <button type="button" class="btn btn-ghost pick" data-view="5">5秒</button>
          <button type="button" class="btn btn-ghost pick" data-view="10">10秒</button>
          <button type="button" class="btn btn-ghost pick" data-view="0">なし</button>
        </div>
        <p class="field-note">なしは、「おぼえた」を押すまで数字が残ります。</p>
      </div>

      <button type="button" class="btn btn-wide" id="setup-start">はじめる</button>
    </section>

    <section id="screen-play" class="screen wrap" hidden>
      <header class="play-top">
        <div class="play-nav">
          <button type="button" class="btn btn-ghost" id="play-quit">やめる</button>
          <a class="back" href="../../index.html">玄関</a>
        </div>
        <div class="hud">
          <p>せいかい <strong id="score">0</strong></p>
          <p><strong id="progress">1</strong> もんめ</p>
        </div>
        <p class="hint" id="hint">おぼえましょう</p>
      </header>

      <div class="stage">
        <div class="digit-line" id="digit-line"></div>
        <p class="judge" id="judge" aria-live="polite"></p>
        <div class="remember-wrap">
          <button type="button" class="btn btn-wide" id="remember" hidden>おぼえた</button>
        </div>
      </div>

      <div class="pad" id="pad">
        <button type="button" class="pad-n" data-n="1">1</button>
        <button type="button" class="pad-n" data-n="2">2</button>
        <button type="button" class="pad-n" data-n="3">3</button>
        <button type="button" class="pad-n" data-n="4">4</button>
        <button type="button" class="pad-n" data-n="5">5</button>
        <button type="button" class="pad-n" data-n="6">6</button>
        <button type="button" class="pad-n" data-n="7">7</button>
        <button type="button" class="pad-n" data-n="8">8</button>
        <button type="button" class="pad-n" data-n="9">9</button>
        <button type="button" id="erase">けす</button>
      </div>
    </section>

    <section id="screen-result" class="screen wrap" hidden>
      <a class="back" href="../../index.html">← 玄関にもどる</a>
      <p class="site-name">数字を逆から</p>
      <h1>おわり</h1>
      <p class="result-score" id="result-score">0</p>
      <p class="result-unit" id="result-unit">0もんちゅう せいかい</p>
      <p class="result-meta" id="result-meta"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-wide" id="again">もういちど</button>
        <button type="button" class="btn btn-ghost btn-wide" id="to-setup">せっていをかえる</button>
        <a class="btn btn-ghost btn-wide" href="../../index.html">玄関にもどる</a>
      </div>
    </section>

    <script src="js/problem.js?v=2"></script>
    <script src="js/storage.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
  </body>
</html>
