<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>後出しじゃんけん｜すぐ・あそび</title>
    <meta
      name="description"
      content="相手の手のあとに、自分の手を出す。設定して遊ぶ。広告なし。"
    />
    <meta name="theme-color" content="#4eb6e0" />
    <link rel="icon" type="image/png" href="../../images/favicon-32.png" />
    <link rel="apple-touch-icon" href="../../images/icon-180.png" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="css/janken.css" />
  </head>
  <body class="janken-page">
    <section id="screen-setup" class="screen wrap">
      <a class="back" href="../../index.html">← ホームに戻る</a>
      <p class="site-name">じゃんけん</p>
      <h1>後出しじゃんけん</h1>
      <p class="lead">相手の手を見てから、自分の手を出します。</p>

      <div class="field">
        <label>ルール</label>
        <div class="picks" data-set="goal">
          <button type="button" class="pick" data-value="aiko">あいこにする</button>
          <button type="button" class="pick" data-value="kachi">勝つ</button>
          <button type="button" class="pick" data-value="make">負ける</button>
        </div>
      </div>
      <div class="field">
        <label>速さ</label>
        <div class="picks cols-2" data-set="speed">
          <button type="button" class="pick" data-value="turbo">超早い</button>
          <button type="button" class="pick" data-value="fast">早い</button>
          <button type="button" class="pick" data-value="normal">普通</button>
          <button type="button" class="pick" data-value="slow">遅い</button>
        </div>
      </div>
      <div class="field">
        <label>時間</label>
        <div class="stepper">
          <button type="button" class="btn btn-ghost" id="time-minus">−</button>
          <output id="out-time">1分</output>
          <button type="button" class="btn btn-ghost" id="time-plus">＋</button>
        </div>
        <p class="field-note">20秒から2分まで。2分のつぎは無限です。</p>
      </div>

      <button type="button" class="btn btn-wide" id="setup-start">始める</button>
    </section>

    <section id="screen-play" class="screen wrap" hidden>
      <header class="play-top">
        <div class="play-nav">
          <button type="button" class="btn btn-ghost" id="play-quit">終了</button>
          <a class="back" href="../../index.html">ホーム</a>
        </div>
        <p class="goal-now" id="goal-now">あいこにする</p>
        <div class="hud">
          <p>残り <strong id="time-left">2:00</strong></p>
          <p>正解 <strong id="score">0</strong></p>
          <p>回数 <strong id="progress">0</strong></p>
        </div>
        <div class="time-bar" aria-hidden="true">
          <span id="hand-bar"></span>
        </div>
      </header>

      <div class="stage">
        <p class="cpu-label">相手</p>
        <p class="cpu-hand" id="cpu-hand">グー</p>
        <p class="judge" id="judge" aria-live="polite"></p>
      </div>

      <div class="hands" id="hands">
        <button type="button" class="hand-btn" data-hand="gu">グー</button>
        <button type="button" class="hand-btn" data-hand="choki">チョキ</button>
        <button type="button" class="hand-btn" data-hand="pa">パー</button>
      </div>
    </section>

    <section id="screen-result" class="screen wrap" hidden>
      <a class="back" href="../../index.html">← ホームに戻る</a>
      <p class="site-name">じゃんけん</p>
      <h1>終了</h1>
      <p class="result-score" id="result-score">0</p>
      <p class="result-unit" id="result-unit">問 正解</p>
      <p class="result-meta" id="result-meta"></p>
      <p class="result-best">この設定の最高 <span id="result-best">0</span> 問</p>
      <p class="new-best" id="result-new" hidden>最高を更新！</p>

      <div class="miss-box">
        <h2>間違えた手</h2>
        <div id="miss-list"></div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-wide" id="again">もう一度</button>
        <button type="button" class="btn btn-ghost btn-wide" id="to-setup">設定を変える</button>
        <a class="btn btn-ghost btn-wide" href="../../index.html">ホームに戻る</a>
      </div>
    </section>

    <script src="js/logic.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>
    <script src="../../js/access-url.js"></script>
    <script src="../../js/access.js"></script>
  </body>
</html>
